<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">AIM 34 · No positive shift works</title><desc id="desc">A theorem for the entire parameter family, not sampled shifts.</desc><rect width="1000" height="300" rx="22" fill="#f7f5ef"/><text x="42" y="53" font-family="sans-serif" font-size="25" font-weight="700" fill="#242d35">AIM 34 · No positive shift works</text><text x="42" y="86" font-family="sans-serif" font-size="17" fill="#64717d">AIM 2007 Problem 34</text><rect x="42" y="119" width="395" height="88" rx="12" fill="#fff"/><rect x="563" y="119" width="395" height="88" rx="12" fill="#fff0dc"/><text x="239" y="173" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#25323c">Every real m > 0</text><path d="M465 164H531m-13-12 13 12-13 12" stroke="#bb6815" stroke-width="4" fill="none"/><text x="760" y="173" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#924c0d">Not a multiplier</text><text x="42" y="257" font-family="sans-serif" font-size="18" fill="#425361">A theorem for the entire parameter family, not sampled shifts.</text></svg>